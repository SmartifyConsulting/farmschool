name: Validate FarmSchool

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Unit tests
        run: bunx vitest run src/lib/course-factory.test.ts src/lib/challenge.test.ts src/lib/studio.test.ts
      - name: Type check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
