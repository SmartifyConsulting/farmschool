<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:480px;background-color:#ffffff;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="background-color:#2765BC;padding:28px 24px;text-align:center;">
                <img src="https://forilla.co.za/plusticity-logo.png" alt="Plusticity" width="140" style="display:inline-block;" />
              </td>
            </tr>
            <tr>
              <td style="padding:32px 32px 24px;">
                <h1 style="margin:0 0 12px;font-size:20px;color:#111827;">Your sign-in link</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#4b5563;">
                  Click the button below to sign in to your Plusticity account. This link will expire
                  shortly for your security.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:8px;background-color:#2765BC;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">
                        Sign in to Plusticity
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#9ca3af;">
                  If you didn't request this link, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 28px;border-top:1px solid #e5e7eb;">
                <p style="margin:16px 0 0;font-size:11px;color:#9ca3af;">
                  © 2026 Smartify Consulting (Pty) Ltd. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
